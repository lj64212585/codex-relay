<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc">
  <title id="title">Codex Relay</title>
  <desc id="desc">Codex Relay contains four routing strategies: cost-first Poor Relay, Explore-only Sol Explore Relay, Sol Pair Relay with two fresh Sol contexts, and Sol-led Relay with complete parent-controlled lanes.</desc>

  <defs>
    <pattern id="selector-grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#20282E" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="570" rx="28" fill="#080B0D"/>
  <rect x="1" y="1" width="1198" height="568" rx="27" fill="none" stroke="#2A333A" stroke-width="2"/>
  <rect width="1200" height="570" rx="28" fill="url(#selector-grid)"/>

  <g id="identity" transform="translate(54 50)">
    <path d="M0 10H28L38 2L48 18L58 10H88" fill="none" stroke="#91E66C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="104" y="17" fill="#9BA6AF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.4">MULTI-AGENT ROUTING</text>

    <text x="0" y="132" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="-2">CODEX</text>
    <text x="0" y="201" fill="none" stroke="#F5B942" stroke-width="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="68" font-weight="800" letter-spacing="5">RELAY</text>

    <text x="2" y="270" fill="#D7DBDE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700">Four routing philosophies.</text>
    <text x="2" y="309" fill="#D7DBDE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="700">One clear boundary.</text>
    <text x="2" y="355" fill="#929DA7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">Choose how work leaves the parent session</text>
    <text x="2" y="385" fill="#929DA7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20">by the context, authority, and quality you protect.</text>

    <g transform="translate(2 472)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700">
      <text x="0" y="0" fill="#91E66C">04</text>
      <text x="28" y="0" fill="#8D98A1">PACKAGES</text>
      <text x="126" y="0" fill="#3D474E">/</text>
      <text x="148" y="0" fill="#F5B942">04</text>
      <text x="176" y="0" fill="#8D98A1">AUTHORITY MODELS</text>
    </g>
  </g>

  <path d="M500 42V528" stroke="#2A333A" stroke-width="2"/>

  <g id="relay-selector" transform="translate(536 26)">
    <g id="poor-relay">
      <rect width="608" height="116" rx="16" fill="#101519" stroke="#344039" stroke-width="2"/>
      <text x="22" y="29" fill="#91E66C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.2">01 · COST FIRST</text>
      <text x="22" y="65" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="760">POOR RELAY</text>
      <text x="580" y="63" text-anchor="end" fill="#91E66C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">5 PROFILES</text>
      <path d="M24 91H580" stroke="#29342D" stroke-width="6" stroke-linecap="round"/>
      <circle cx="24" cy="91" r="6" fill="#91E66C"/>
      <circle cx="232" cy="91" r="6" fill="#91E66C"/>
      <circle cx="400" cy="91" r="6" fill="#BBC3C9"/>
      <circle cx="580" cy="91" r="6" fill="#F5B942"/>
      <text x="24" y="110" fill="#89949C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">LUNA BULK</text>
      <text x="580" y="110" text-anchor="end" fill="#89949C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">SOL ON DEMAND</text>
    </g>

    <g id="sol-explore-relay" transform="translate(0 130)">
      <rect width="608" height="116" rx="16" fill="#101719" stroke="#31534F" stroke-width="2"/>
      <text x="22" y="29" fill="#6DD6C3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.2">02 · EXPLORE ONLY</text>
      <text x="22" y="65" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="760">SOL EXPLORE RELAY</text>
      <text x="580" y="63" text-anchor="end" fill="#6DD6C3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">4 READ-ONLY</text>
      <circle cx="28" cy="92" r="7" fill="#F5B942"/>
      <path d="M40 92H112M112 92V80H198M112 92H310M112 92V104H420M426 104H540V92H574" fill="none" stroke="#6DD6C3" stroke-width="3" stroke-linecap="round"/>
      <circle cx="198" cy="80" r="5" fill="#6DD6C3"/>
      <circle cx="310" cy="92" r="5" fill="#6DD6C3"/>
      <circle cx="420" cy="104" r="5" fill="#6DD6C3"/>
      <circle cx="580" cy="92" r="6" fill="#F5B942"/>
      <text x="580" y="111" text-anchor="end" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">PARENT SOL WRITES</text>
    </g>

    <g id="sol-pair-relay" transform="translate(0 260)">
      <rect width="608" height="116" rx="16" fill="#15141A" stroke="#51496E" stroke-width="2"/>
      <text x="22" y="29" fill="#B8A7FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.2">03 · FRESH CONTEXT PAIR</text>
      <text x="22" y="65" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="760">SOL PAIR RELAY</text>
      <text x="580" y="63" text-anchor="end" fill="#B8A7FF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">3 PROFILES</text>
      <circle cx="28" cy="92" r="6" fill="#6DD6C3"/>
      <path d="M38 92H126" stroke="#6DD6C3" stroke-width="3"/>
      <rect x="126" y="78" width="110" height="28" rx="7" fill="#282319" stroke="#66552A"/>
      <text x="181" y="98" text-anchor="middle" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700">SOL PLAN</text>
      <path d="M236 92H298" stroke="#F5B942" stroke-width="3"/>
      <path d="M298 78H374L390 94V106H298Z" fill="#F5F1E8"/>
      <text x="344" y="100" text-anchor="middle" fill="#26231C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14" font-weight="800">plan.md</text>
      <path d="M390 92H434" stroke="#F5B942" stroke-width="3"/>
      <rect x="434" y="78" width="146" height="28" rx="7" fill="#282319" stroke="#66552A"/>
      <text x="507" y="98" text-anchor="middle" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15" font-weight="700">SOL EXEC + ACCEPT</text>
    </g>

    <g id="sol-led-relay" transform="translate(0 390)">
      <rect width="608" height="116" rx="16" fill="#121518" stroke="#4B432F" stroke-width="2"/>
      <text x="22" y="29" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.2">04 · CONTROLLED LANES</text>
      <text x="22" y="65" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="27" font-weight="760">SOL-LED RELAY</text>
      <text x="580" y="63" text-anchor="end" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700">9 PROFILES</text>
      <circle cx="28" cy="92" r="7" fill="#F5B942"/>
      <path d="M40 92H84M84 92V79M84 92V105M84 79H172M84 92H326M84 105H484" fill="none" stroke="#F5B942" stroke-width="3" stroke-linecap="round"/>
      <circle cx="172" cy="79" r="5" fill="#6DD6C3"/>
      <circle cx="326" cy="92" r="5" fill="#F5B942"/>
      <circle cx="484" cy="105" r="5" fill="#6DD6C3"/>
      <text x="188" y="85" fill="#9DA7AE" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">EXPLORE</text>
      <text x="342" y="98" fill="#9DA7AE" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">EXECUTE</text>
      <text x="500" y="111" fill="#9DA7AE" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="15">REVIEW</text>
    </g>
  </g>
</svg>
