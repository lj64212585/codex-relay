<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Codex Relay — responsibility routes</title>
  <desc id="desc">Explore delegates evidence; Implementation delegates settled slices and review; Budget separates planning, execution, and integration.</desc>
  <rect width="1200" height="650" rx="12" fill="#f4f3ee"/>
  <g font-family="Segoe UI, Microsoft YaHei, sans-serif">
    <g id="identity">
      <path d="M40 48 H61 Q76 48 76 63 V83 M40 83 H55 Q61 83 61 77 V63 H91" stroke="#202b2b" stroke-width="4" fill="none"/>
      <circle cx="91" cy="63" r="5" fill="#167764"/>
      <text x="111" y="82" fill="#202b2b" font-size="46" font-weight="700" letter-spacing="-1.5">Codex Relay</text>
      <text x="1154" y="77" text-anchor="end" fill="#56615e" font-size="24">Three routes. Clear ownership.</text>
      <path d="M40 116 H1160" stroke="#ced3cc"/>
    </g>
    <g id="route-explore" transform="translate(0 150)">
      <text x="40" y="23" fill="#167764" font-family="Consolas, monospace" font-size="22">01</text>
      <text x="88" y="26" fill="#202b2b" font-size="32" font-weight="650">Explore</text>
      <text x="88" y="61" fill="#167764" font-size="18">DEFAULT / EVIDENCE</text>
      <path d="M472 36 H1090" stroke="#a9b4ad" stroke-width="2" fill="none"/>
      <text x="475" y="12" text-anchor="middle" fill="#35433e" font-size="23">Understand</text>
      <circle cx="475" cy="36" r="5" fill="#f4f3ee" stroke="#167764" stroke-width="2"/>
      <text x="785" y="12" text-anchor="middle" fill="#35433e" font-size="23">Implement</text>
      <circle cx="785" cy="36" r="5" fill="#f4f3ee" stroke="#167764" stroke-width="2"/>
      <text x="1090" y="12" text-anchor="middle" fill="#35433e" font-size="23">Verify</text>
      <circle cx="1090" cy="36" r="5" fill="#f4f3ee" stroke="#167764" stroke-width="2"/>
      <path d="M510 36 V76 Q510 88 522 88 H1028 Q1040 88 1040 76 V42" stroke="#167764" stroke-width="2.5" fill="none"/>
      <path d="M1035 49 L1040 41 L1045 49" stroke="#167764" stroke-width="2" fill="none"/>

      <text x="776" y="116" text-anchor="middle" fill="#167764" font-size="22">Read-only exploration → evidence</text>
      <path d="M40 128 H1160" stroke="#dce0d8"/>
    </g>
    <g id="route-implementation" transform="translate(0 303)">
      <text x="40" y="23" fill="#365b99" font-family="Consolas, monospace" font-size="22">02</text>
      <text x="88" y="26" fill="#202b2b" font-size="32" font-weight="650">Implementation</text>
      <text x="88" y="61" fill="#365b99" font-size="18">ON DEMAND / SETTLED SLICES</text>
      <path d="M472 36 H1090" stroke="#a9b4ad" stroke-width="2" fill="none"/>
      <text x="475" y="12" text-anchor="middle" fill="#35433e" font-size="23">Scope</text>
      <circle cx="475" cy="36" r="5" fill="#f4f3ee" stroke="#365b99" stroke-width="2"/>
      <text x="785" y="12" text-anchor="middle" fill="#35433e" font-size="23">Core work</text>
      <circle cx="785" cy="36" r="5" fill="#f4f3ee" stroke="#365b99" stroke-width="2"/>
      <text x="1090" y="12" text-anchor="middle" fill="#35433e" font-size="23">Verify</text>
      <circle cx="1090" cy="36" r="5" fill="#f4f3ee" stroke="#365b99" stroke-width="2"/>
      <path d="M510 36 V76 Q510 88 522 88 H1028 Q1040 88 1040 76 V42" stroke="#365b99" stroke-width="2.5" fill="none"/>
      <path d="M1035 49 L1040 41 L1045 49" stroke="#365b99" stroke-width="2" fill="none"/>

      <text x="776" y="116" text-anchor="middle" fill="#365b99" font-size="22">Bounded writing + independent review</text>
      <path d="M40 128 H1160" stroke="#dce0d8"/>
    </g>
    <g id="route-budget" transform="translate(0 456)">
      <text x="40" y="23" fill="#946122" font-family="Consolas, monospace" font-size="22">03</text>
      <text x="88" y="26" fill="#202b2b" font-size="32" font-weight="650">Budget</text>
      <text x="88" y="61" fill="#946122" font-size="18">BUDGET / STAGED EXECUTION</text>
      <path d="M472 36 H1090" stroke="#a9b4ad" stroke-width="2" fill="none"/>
      <text x="475" y="12" text-anchor="middle" fill="#35433e" font-size="23">Plan</text>
      <circle cx="475" cy="36" r="5" fill="#f4f3ee" stroke="#946122" stroke-width="2"/>
      <text x="785" y="12" text-anchor="middle" fill="#35433e" font-size="23">Execute + review</text>
      <circle cx="785" cy="36" r="5" fill="#f4f3ee" stroke="#946122" stroke-width="2"/>
      <text x="1090" y="12" text-anchor="middle" fill="#35433e" font-size="23">Integrate</text>
      <circle cx="1090" cy="36" r="5" fill="#f4f3ee" stroke="#946122" stroke-width="2"/>
      <path d="M490 36 H755 M807 36 H1070" stroke="#946122" stroke-width="3"/>
      <path d="M747 31 L755 36 L747 41 M1062 31 L1070 36 L1062 41" stroke="#946122" stroke-width="2" fill="none"/>
      <text x="785" y="92" text-anchor="middle" fill="#946122" font-size="22">Settled boundaries · escalate uncertainty</text>
    </g>
    <path d="M40 594 H1160" stroke="#ced3cc"/>
    <text x="40" y="627" fill="#56615e" font-size="20">Stable responsibilities / configurable models</text>
    <text x="1160" y="627" text-anchor="end" fill="#56615e" font-family="Consolas, monospace" font-size="18">SKILLS + AGENTS</text>
  </g>
</svg>
