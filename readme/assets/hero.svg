<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Codex Relay</title>
  <desc id="desc">Codex Relay 包含两条多 Agent 调度线路：成本优先的 Poor Relay，以及由父级 Sol 控制的 Sol-led Relay。</desc>

  <defs>
    <pattern id="relay-grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M56 0H0V56" fill="none" stroke="#20272D" stroke-width="1" opacity="0.48"/>
    </pattern>
  </defs>

  <rect width="1200" height="440" rx="28" fill="#080B0D"/>
  <rect x="1" y="1" width="1198" height="438" rx="27" fill="none" stroke="#293139" stroke-width="2"/>
  <rect width="1200" height="440" rx="28" fill="url(#relay-grid)"/>

  <g id="identity" transform="translate(60 50)">
    <path d="M0 10H34L43 2L52 18L61 10H94" fill="none" stroke="#91E66C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="112" y="17" fill="#9BA6AF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.8">TWO ROUTING PACKAGES · ONE REPOSITORY</text>

    <text x="0" y="126" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="72" font-weight="800" letter-spacing="-2">CODEX</text>
    <text x="0" y="198" fill="none" stroke="#F5B942" stroke-width="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="72" font-weight="800" letter-spacing="5">RELAY</text>

    <text x="2" y="252" fill="#D7DBDE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="650">两种调度哲学，一套清晰边界。</text>
    <text x="2" y="289" fill="#929DA7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="22">按真正需要守住的资源选择线路。</text>

    <g transform="translate(2 344)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.1">
      <circle cx="6" cy="-6" r="6" fill="#91E66C"/>
      <text x="24" y="0" fill="#91E66C">COST FIRST</text>
      <path d="M154 -6H194" stroke="#39434B" stroke-width="2"/>
      <circle cx="204" cy="-6" r="6" fill="#F5B942"/>
      <text x="222" y="0" fill="#F5B942">CONTROL FIRST</text>
    </g>
  </g>

  <path d="M568 42V398" stroke="#2A3239" stroke-width="2"/>

  <g id="relay-selector" transform="translate(612 44)">
    <g id="poor-relay">
      <rect width="532" height="160" rx="18" fill="#101519" stroke="#344039" stroke-width="2"/>
      <text x="24" y="34" fill="#91E66C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.5">01 · COST-AWARE ROUTE</text>
      <text x="24" y="75" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="750">POOR RELAY</text>
      <text x="506" y="73" text-anchor="end" fill="#91E66C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">5 PROFILES</text>

      <path d="M26 116H506" stroke="#26312B" stroke-width="8" stroke-linecap="round"/>
      <path d="M26 116H246" stroke="#91E66C" stroke-width="4" stroke-linecap="round"/>
      <path d="M246 116H370M370 116H506" stroke="#69747C" stroke-width="3" stroke-dasharray="8 9"/>
      <circle cx="26" cy="116" r="9" fill="#91E66C"/>
      <circle cx="246" cy="116" r="9" fill="#91E66C"/>
      <circle cx="370" cy="116" r="9" fill="#BBC3C9"/>
      <circle cx="506" cy="116" r="9" fill="#F5B942"/>
      <text x="26" y="146" fill="#A8B2BA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700">LUNA ×2</text>
      <text x="370" y="146" text-anchor="middle" fill="#A8B2BA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700">TERRA ×1</text>
      <text x="506" y="146" text-anchor="end" fill="#A8B2BA" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700">SOL ×2</text>
    </g>

    <g id="sol-led-relay" transform="translate(0 190)">
      <rect width="532" height="162" rx="18" fill="#111519" stroke="#3E3A2B" stroke-width="2"/>
      <text x="24" y="34" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.5">02 · PARENT-CONTROLLED ROUTE</text>
      <text x="24" y="75" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="750">SOL-LED RELAY</text>
      <text x="506" y="73" text-anchor="end" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="20" font-weight="700">9 PROFILES</text>

      <circle cx="34" cy="121" r="12" fill="#F5B942"/>
      <circle cx="34" cy="121" r="4" fill="#080B0D"/>
      <path d="M46 121H94M94 121V96M94 121V146" fill="none" stroke="#F5B942" stroke-width="3" stroke-linecap="round"/>
      <path d="M94 96H128M94 121H278M94 146H410" stroke="#F5B942" stroke-width="3" stroke-linecap="round"/>
      <circle cx="128" cy="96" r="7" fill="#6DD6C3"/>
      <circle cx="278" cy="121" r="7" fill="#F5B942"/>
      <circle cx="410" cy="146" r="7" fill="#6DD6C3"/>
      <text x="148" y="103" fill="#C8CED2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700">EXPLORE ×4</text>
      <text x="298" y="128" fill="#C8CED2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700">EXECUTE ×3</text>
      <text x="430" y="153" fill="#C8CED2" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700">REVIEW ×2</text>
    </g>
  </g>
</svg>
