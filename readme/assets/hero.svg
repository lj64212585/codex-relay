<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="490" viewBox="0 0 1080 490" role="img"><title>Codex Relay</title><desc>Three responsibility-based routing modes</desc><rect width="1080" height="490" rx="20" fill="#121b25"/><g font-family="Segoe UI, Arial, sans-serif"><text x="40" y="68" fill="#f5f7fa" font-size="38" font-weight="700">CODEX RELAY</text><text x="40" y="108" fill="#c1ccd7" font-size="21">Responsibilities stay stable. Models are configuration.</text><g transform="translate(40 145)"><rect width="1000" height="88" rx="14" fill="#202c39"/><text x="24" y="34" fill="#8ee6cc" font-size="23">EXPLORE RELAY</text><text x="24" y="63" fill="#c1ccd7" font-size="17">Parent implementation · Read-only evidence</text><text x="970" y="36" text-anchor="end" fill="#f5d181" font-size="16">DEFAULT</text></g><g transform="translate(40 250)"><rect width="1000" height="88" rx="14" fill="#202c39"/><text x="24" y="34" fill="#8ee6cc" font-size="23">IMPLEMENTATION RELAY</text><text x="24" y="63" fill="#c1ccd7" font-size="17">Settled slices · Independent risk review</text><text x="970" y="36" text-anchor="end" fill="#f5d181" font-size="16">ON DEMAND</text></g><g transform="translate(40 355)"><rect width="1000" height="88" rx="14" fill="#202c39"/><text x="24" y="34" fill="#8ee6cc" font-size="23">BUDGET RELAY</text><text x="24" y="63" fill="#c1ccd7" font-size="17">Settled behavior · Early uncertainty escalation</text><text x="970" y="36" text-anchor="end" fill="#f5d181" font-size="16">BUDGET</text></g></g></svg>
