<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
  <title id="title">Codex Relay</title>
  <desc id="desc">Codex Relay 收录三套调度策略：成本优先的 Poor Relay、只委派探索的 Sol Explore Relay，以及父级 Sol 控制三条专用回路的 Sol-led Relay。</desc>

  <defs>
    <pattern id="selector-grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#20282E" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>

  <rect width="1200" height="500" rx="28" fill="#080B0D"/>
  <rect x="1" y="1" width="1198" height="498" rx="27" fill="none" stroke="#2A333A" stroke-width="2"/>
  <rect width="1200" height="500" rx="28" fill="url(#selector-grid)"/>

  <g id="identity" transform="translate(56 52)">
    <path d="M0 10H32L42 2L52 18L62 10H96" fill="none" stroke="#91E66C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="114" y="17" fill="#9BA6AF" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="18" font-weight="700" letter-spacing="1.7">MULTI-AGENT ROUTING PACKAGES</text>

    <text x="0" y="126" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="70" font-weight="800" letter-spacing="-2">CODEX</text>
    <text x="0" y="196" fill="none" stroke="#F5B942" stroke-width="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="70" font-weight="800" letter-spacing="5">RELAY</text>

    <text x="2" y="258" fill="#D7DBDE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="700">三种调度哲学，</text>
    <text x="2" y="296" fill="#D7DBDE" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" font-weight="700">一套清晰边界。</text>
    <text x="2" y="340" fill="#929DA7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20">按必须守住的东西，选择工作离开父会话的范围。</text>

    <g transform="translate(2 406)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700">
      <text x="0" y="0" fill="#91E66C">03</text>
      <text x="28" y="0" fill="#8D98A1">PACKAGES</text>
      <text x="126" y="0" fill="#3D474E">/</text>
      <text x="148" y="0" fill="#F5B942">03</text>
      <text x="176" y="0" fill="#8D98A1">AUTHORITY MODELS</text>
    </g>
  </g>

  <path d="M540 42V458" stroke="#2A333A" stroke-width="2"/>

  <g id="relay-selector" transform="translate(576 36)">
    <g id="poor-relay">
      <rect width="568" height="128" rx="17" fill="#101519" stroke="#344039" stroke-width="2"/>
      <text x="24" y="30" fill="#91E66C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.3">01 · COST FIRST</text>
      <text x="24" y="68" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="760">POOR RELAY</text>
      <text x="540" y="66" text-anchor="end" fill="#91E66C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">5 PROFILES</text>
      <path d="M26 99H542" stroke="#29342D" stroke-width="7" stroke-linecap="round"/>
      <path d="M26 99H236" stroke="#91E66C" stroke-width="4" stroke-linecap="round"/>
      <circle cx="26" cy="99" r="7" fill="#91E66C"/>
      <circle cx="236" cy="99" r="7" fill="#91E66C"/>
      <circle cx="382" cy="99" r="7" fill="#BBC3C9"/>
      <circle cx="542" cy="99" r="7" fill="#F5B942"/>
      <text x="26" y="120" fill="#89949C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">LUNA</text>
      <text x="542" y="120" text-anchor="end" fill="#89949C" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">SOL</text>
    </g>

    <g id="sol-explore-relay" transform="translate(0 146)">
      <rect width="568" height="128" rx="17" fill="#101719" stroke="#31534F" stroke-width="2"/>
      <text x="24" y="30" fill="#6DD6C3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.3">02 · EXPLORE ONLY</text>
      <text x="24" y="68" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="760">SOL EXPLORE RELAY</text>
      <text x="540" y="66" text-anchor="end" fill="#6DD6C3" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">4 READ-ONLY</text>

      <circle cx="32" cy="101" r="9" fill="#F5B942"/>
      <circle cx="32" cy="101" r="3" fill="#080B0D"/>
      <path d="M43 101H88V88H126M88 101H244M88 101V114H362" fill="none" stroke="#6DD6C3" stroke-width="3" stroke-linecap="round"/>
      <circle cx="126" cy="88" r="6" fill="#6DD6C3"/>
      <circle cx="244" cy="101" r="6" fill="#6DD6C3"/>
      <circle cx="362" cy="114" r="6" fill="#6DD6C3"/>
      <path d="M368 114H438V101H528" fill="none" stroke="#6DD6C3" stroke-width="3"/>
      <circle cx="540" cy="101" r="7" fill="#F5B942"/>
      <text x="540" y="123" text-anchor="end" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16" font-weight="700">SOL WRITES</text>
    </g>

    <g id="sol-led-relay" transform="translate(0 292)">
      <rect width="568" height="128" rx="17" fill="#121518" stroke="#4B432F" stroke-width="2"/>
      <text x="24" y="30" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="17" font-weight="700" letter-spacing="1.3">03 · CONTROLLED LANES</text>
      <text x="24" y="68" fill="#F5F1E8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="28" font-weight="760">SOL-LED RELAY</text>
      <text x="540" y="66" text-anchor="end" fill="#F5B942" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="19" font-weight="700">9 PROFILES</text>
      <circle cx="32" cy="101" r="9" fill="#F5B942"/>
      <path d="M43 101H82M82 101V84M82 101V118M82 84H150M82 101H290M82 118H430" fill="none" stroke="#F5B942" stroke-width="3" stroke-linecap="round"/>
      <circle cx="150" cy="84" r="6" fill="#6DD6C3"/>
      <circle cx="290" cy="101" r="6" fill="#F5B942"/>
      <circle cx="430" cy="118" r="6" fill="#6DD6C3"/>
      <text x="168" y="90" fill="#9DA7AE" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">EXPLORE</text>
      <text x="308" y="107" fill="#9DA7AE" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">EXECUTE</text>
      <text x="448" y="124" fill="#9DA7AE" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="16">REVIEW</text>
    </g>
  </g>
</svg>
